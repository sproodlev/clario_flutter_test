name: fluttertest
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: 3.5.4
  flutter: 2.24.4

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: 5.9.3
  bloc: 8.1.4
  flutter_bloc: 8.1.6
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  get_it: 7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.4.12
  freezed: 2.5.7
  json_serializable: 6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter-VariableFont.ttf
